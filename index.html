<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="main.css" />
        <title>Precise Calculator</title>


        <!-- MathQuill CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.css"/>
        
        <!-- jQuery (Required Dependency) - Must load BEFORE MathQuill JS -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        
        <!-- MathQuill JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>
    </head>


    <body>
        <div class="header">
            <h1>Precise Calculator</h1>
        </div>

        
        <div class="calculator-container">
            <div class="calculator-box">
                <div class="input-output-box">
                    <div class="history" id="history"></div>
                    <div class="input-row">
                        <span class="input" id="calculatorInput" contenteditable="true" spellcheck="false"></span>
                    </div>
                </div>
            
                <div class="button-container">
                    <aside id="advanced-buttons"></aside>
                    <aside id="main-buttons"></aside>
                </div>
            </div>
        </div>


        <div class="footer">
            <p>Powered by MathQuill: MathQuill is copyright © 2011-2024 by Han, Jeanine, and Mary. Licensed under the Mozilla Public License v. 2.0.</p>
        </div>

        <script src="script.js"></script>
    </body>
</html>
